<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback | CHARUSAT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="home.html">
                <span class="badge bg-white text-primary fw-bold px-2 py-1">CHARUSAT</span>
                <span class="fw-bold tracking-wide">CHARUSAT STUDENT HUB</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="timetable.html">Timetable</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-light btn-sm" id="themeToggleBtn">Dark</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4" style="max-width: 720px;">
        <header class="mb-4 text-center">
            <h1 class="h3 fw-bold text-primary mb-1">Academic & Portal Feedback</h1>
            <p class="text-muted small">Your feedback helps us continuously improve university infrastructure and portal services.</p>
        </header>

        <div class="card shadow-sm border p-4">
            <form onsubmit="event.preventDefault(); alert('Thank you! Your feedback has been recorded anonymously.'); this.reset();">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Feedback Category</label>
                    <select class="form-select form-select-sm" required>
                        <option value="" selected disabled>Select Category</option>
                        <option value="portal">StudentHub Web Portal Usability</option>
                        <option value="academic">Classroom & Academic Teaching</option>
                        <option value="lab">Computer Lab & Hardware Facilities</option>
                        <option value="library">Library & Digital Resources</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Overall Rating</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="rating" id="r5" checked>
                            <label class="form-check-label small" for="r5">5 - Excellent</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="rating" id="r4">
                            <label class="form-check-label small" for="r4">4 - Good</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="rating" id="r3">
                            <label class="form-check-label small" for="r3">3 - Satisfactory</label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Detailed Feedback & Suggestions</label>
                    <textarea class="form-control form-control-sm" rows="4" placeholder="Share your suggestions..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-sm px-4">Submit Feedback</button>
            </form>
        </div>
    </main>

    <footer class="text-center py-3 text-muted small mt-auto border-top bg-white">
        © 2026 CHARUSAT Student Hub - Charotar University of Science and Technology
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/common.js"></script>
</body>
</html>
