<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login | CHARUSAT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; background-color: #f8fafc; }
        .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .login-card { width: 100%; max-width: 440px; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: #ffffff; padding: 32px 28px; }
        .login-logo { width: 44px; height: 44px; background: #0d6efd; color: #fff; font-weight: bold; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; margin-bottom: 12px; }
        .form-label { font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 4px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="home.html">
                <span class="badge bg-white text-primary fw-bold px-2 py-1">CHARUSAT</span>
                <span class="fw-bold tracking-wide">CHARUSAT STUDENT HUB</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-light btn-sm" id="themeToggleBtn">Dark</button>
            </div>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="text-center mb-3">
                <div class="login-logo">CHARUSAT</div>
                <h1 class="h5 fw-bold mb-1">Student Portal Login</h1>
                <p class="text-muted small mb-0">Access your academic records and dashboard</p>
            </div>

            <!-- Dynamic Feedback Messages -->
            <div id="loginAlertBox"></div>

            <form method="POST" action="../php/login_process.php">
                <div class="mb-3">
                    <label class="form-label" for="username">Username / Enrollment No.</label>
                    <input type="text" class="form-control form-control-sm" id="username" name="username" placeholder="e.g. STU2026001" required autofocus>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0" for="password">Password</label>
                        <a href="#" class="small text-decoration-none text-muted" onclick="alert('For password reset, please contact the IT Helpdesk at student@charusat.edu.in');">Forgot password?</a>
                    </div>
                    <input type="password" class="form-control form-control-sm" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label small text-secondary" for="remember">
                        Remember me on this device
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>

            <div class="text-center mt-4">
                <span class="small text-muted">New student? </span>
                <a href="register.html" class="small fw-semibold text-primary text-decoration-none">Register for portal</a>
            </div>
        </div>
    </div>

    <div class="text-center py-2 small text-secondary">
        <a href="about.html" class="text-decoration-none text-secondary mx-2">About</a> |
        <a href="contact.html" class="text-decoration-none text-secondary mx-2">Contact</a> |
        <a href="login.html" class="text-decoration-none text-secondary mx-2">Login</a>
    </div>

    <footer class="text-center py-3 text-muted small mt-auto border-top bg-white">
        © 2026 CHARUSAT Student Hub - Charotar University of Science and Technology
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/common.js"></script>
    <script>
        // Check query parameters for authentication alerts
        const urlParams = new URLSearchParams(window.location.search);
        const alertBox = document.getElementById('loginAlertBox');
        if (urlParams.get('msg') === 'unauthorized') {
            alertBox.innerHTML = `<div class="alert alert-danger py-2 px-3 small mb-3">Please log in to access your dashboard.</div>`;
        } else if (urlParams.get('msg') === 'timeout') {
            alertBox.innerHTML = `<div class="alert alert-warning py-2 px-3 small mb-3">Session timed out after 30 minutes of inactivity. Please log in again.</div>`;
        } else if (urlParams.get('msg') === 'logged_out') {
            alertBox.innerHTML = `<div class="alert alert-info py-2 px-3 small mb-3">You have been logged out successfully.</div>`;
        } else if (urlParams.get('error')) {
            alertBox.innerHTML = `<div class="alert alert-danger py-2 px-3 small mb-3">${decodeURIComponent(urlParams.get('error'))}</div>`;
        }
    </script>
</body>
</html>
