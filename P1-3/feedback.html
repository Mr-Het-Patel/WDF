<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5.3 CSS: responsive grid, utilities, cards, forms and components. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>StudentHub | Feedback</title>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">StudentHub Portal</a>
            <!-- Bootstrap navbar-toggler: mobile-first collapsible navigation. -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
                    <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <section class="card shadow-sm border-0 mx-auto" style="max-width:720px">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center fw-bold mb-4">Feedback Form</h2><!-- Bootstrap form controls. -->
                <form>
                    <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control"
                            id="name" type="text" placeholder="Enter Name"></div>
                    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control"
                            id="email" type="email" placeholder="Enter Email"></div>
                    <div class="mb-3"><label class="form-label" for="feedback">Your Feedback</label><textarea
                            class="form-control" id="feedback" rows="5" placeholder="Write your feedback"></textarea>
                    </div><button class="btn btn-primary w-100" type="submit">Submit Feedback</button>
                </form>
            </div>
        </section>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">© 2026 StudentHub Portal</div>
    </footer>
    <!-- Bootstrap JS bundle: enables navbar and accordion interactions. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
