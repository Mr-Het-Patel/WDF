<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5.3 CSS: responsive grid, utilities, cards, forms and components. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>StudentHub | Register</title>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">StudentHub Portal</a>
            <!-- Bootstrap navbar-toggler: mobile-first collapsible navigation. -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
                    <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <section class="card shadow-sm border-0 mx-auto" style="max-width:720px">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center fw-bold mb-4">Student Registration</h2>
                <!-- Bootstrap form-label, form-control, form-select, form-check and btn. -->
                <form>
                    <div class="mb-3"><label class="form-label" for="name">Full Name</label><input class="form-control"
                            id="name" placeholder="Enter your full name"></div>
                    <div class="mb-3"><label class="form-label" for="email">Email Address</label><input
                            class="form-control" type="email" id="email" placeholder="Enter your email"></div>
                    <div class="mb-3"><label class="form-label" for="mobile">Mobile Number</label><input
                            class="form-control" type="tel" id="mobile" placeholder="Enter mobile number"></div>
                    <div class="mb-3"><label class="form-label" for="course">Course</label><select class="form-select"
                            id="course">
                            <option>Select Course</option>
                            <option>B.Tech Computer Engineering</option>
                            <option>B.Tech Information Technology</option>
                            <option>B.Tech Civil Engineering</option>
                            <option>B.Tech Mechanical Engineering</option>
                        </select></div>
                    <div class="mb-3"><label class="form-label" for="year">Year</label><select class="form-select"
                            id="year">
                            <option>First Year</option>
                            <option>Second Year</option>
                            <option>Third Year</option>
                            <option>Fourth Year</option>
                        </select></div>
                    <fieldset class="mb-3">
                        <legend class="fs-6 fw-semibold">Gender</legend>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check"><input class="form-check-input" type="radio" name="gender"
                                    id="male"><label class="form-check-label" for="male">Male</label></div>
                            <div class="form-check"><input class="form-check-input" type="radio" name="gender"
                                    id="female"><label class="form-check-label" for="female">Female</label></div>
                            <div class="form-check"><input class="form-check-input" type="radio" name="gender"
                                    id="other"><label class="form-check-label" for="other">Other</label></div>
                        </div>
                    </fieldset>
                    <div class="mb-3"><label class="form-label" for="password">Password</label><input
                            class="form-control" type="password" id="password" placeholder="Create Password"></div>
                    <div class="mb-3"><label class="form-label" for="confirm">Confirm Password</label><input
                            class="form-control" type="password" id="confirm" placeholder="Confirm Password"></div>
                    <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms"><label
                            class="form-check-label" for="terms">I agree to the Terms &amp; Conditions</label></div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                    <p class="text-center mt-3 mb-1">Already registered? <a href="login.html">Login here</a></p>
                    <p class="text-center"><a href="home.html">Back to Home</a></p>
                </form>
            </div>
        </section>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">© 2026 StudentHub Portal</div>
    </footer>
    <!-- Bootstrap JS bundle: enables navbar and accordion interactions. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
